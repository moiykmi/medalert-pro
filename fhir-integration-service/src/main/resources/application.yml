server:
  port: 8081   # 8080 ya lo usa el mock HAPI FHIR

spring:
  application:
    name: fhir-integration-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:medalert}
    username: ${POSTGRES_USER:medalert}
    password: ${POSTGRES_PASSWORD:medalert_dev_pw}

  jpa:
    hibernate:
      ddl-auto: validate   # el esquema lo crea Flyway, no Hibernate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Los 3 microservicios comparten una única base de datos y por lo tanto la
    # misma tabla flyway_schema_history — cada uno solo trae en su classpath
    # las migraciones de SU propio dominio, no las de los otros dos. Sin esto,
    # Flyway falla al validar en cuanto aparece en el historial una versión
    # aplicada por otro servicio que este no conoce localmente.
    ignore-migration-patterns: "*:missing,*:future"

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:medalert}
    password: ${RABBITMQ_DEFAULT_PASS:medalert_dev_pw}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

medalert:
  cors:
    allowed-origins: ${ALLOWED_ORIGIN:http://localhost:*,http://127.0.0.1:*}
  fhir:
    server-url: ${FHIR_SERVER_URL:http://localhost:8080/fhir}
  rabbitmq:
    exchange: medalert.eventos
    routing-key: cancelacion.registrada
    queue: cancelaciones.eventos
  admin:
    token: ${MEDALERT_ADMIN_TOKEN:medalert-admin-dev-token}
  medico:
    # Sesión del portal médico (login por email+contraseña), token opaco en Redis
    # igual que la sesión de pacientes — ver MedicoAuthService.
    sesion-ttl-minutos: ${MEDICO_SESION_TTL_MINUTOS:240}

logging:
  level:
    cl.medalertpro: DEBUG
