# MedAlert Pro — Stack completo en Docker (infraestructura + microservicios + frontend)
# Para desarrollo con hot-reload, sigue usando docker-compose.dev.yml (solo infra)
# y corriendo los servicios a mano con gradle/npm.
#
# Levantar:  docker compose up -d --build
# Apagar:    docker compose down
# Apagar y borrar datos: docker compose down -v

services:

  postgres:
    image: postgres:15
    container_name: medalert-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: medalert
      POSTGRES_USER: medalert
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medalert_dev_pw}
    ports:
      - "5432:5432"
    volumes:
      - medalert_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medalert -d medalert"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management
    container_name: medalert-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: medalert
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-medalert_dev_pw}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  hapi-fhir:
    image: hapiproject/hapi:v7.2.0
    container_name: medalert-hapi-fhir
    restart: unless-stopped
    environment:
      hapi.fhir.default_encoding: json
      hapi.fhir.fhir_version: R4
      hapi.fhir.narrative_enabled: "false"
      hapi.fhir.validation.requests_enabled: "false"
    ports:
      - "8080:8080"

  redis:
    image: redis:7
    container_name: medalert-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  fhir-integration-service:
    build: ./fhir-integration-service
    container_name: medalert-fhir-integration
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: medalert
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medalert_dev_pw}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_DEFAULT_USER: medalert
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-medalert_dev_pw}
      FHIR_SERVER_URL: http://hapi-fhir:8080/fhir
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      hapi-fhir:
        condition: service_started

  notification-service:
    build: ./notification-service
    container_name: medalert-notification
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: medalert
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medalert_dev_pw}
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_DEFAULT_USER: medalert
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-medalert_dev_pw}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-notificaciones@medalertpro.test}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_SMS_FROM_NUMBER: ${TWILIO_SMS_FROM_NUMBER:-}
      TWILIO_WHATSAPP_FROM_NUMBER: ${TWILIO_WHATSAPP_FROM_NUMBER:-whatsapp:+14155238886}
      MEDALERT_ADMIN_TOKEN: ${MEDALERT_ADMIN_TOKEN:-medalert-admin-dev-token}
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  patient-portal-service:
    build: ./patient-portal-service
    container_name: medalert-patient-portal-service
    restart: unless-stopped
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: medalert
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medalert_dev_pw}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MAIL_HOST: ${MAIL_HOST:-sandbox.smtp.mailtrap.io}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-notificaciones@medalertpro.test}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_SMS_FROM_NUMBER: ${TWILIO_SMS_FROM_NUMBER:-}
    ports:
      - "8083:8083"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  patient-portal:
    build: ./patient-portal
    container_name: medalert-patient-portal
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - notification-service
      - patient-portal-service

volumes:
  medalert_postgres_data:
