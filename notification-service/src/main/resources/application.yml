server:
  port: 8082   # 8080 = mock FHIR, 8081 = fhir-integration-service

spring:
  application:
    name: notification-service

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:medalert}
    username: ${POSTGRES_USER:medalert}
    password: ${POSTGRES_PASSWORD:medalert_dev_pw}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    # Los 3 microservicios comparten una única base de datos y por lo tanto la
    # misma tabla flyway_schema_history — cada uno solo trae en su classpath
    # las migraciones de SU propio dominio, no las de los otros dos. Sin esto,
    # Flyway falla al validar en cuanto aparece en el historial una versión
    # aplicada por otro servicio que este no conoce localmente.
    ignore-migration-patterns: "*:missing,*:future"

  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_DEFAULT_USER:medalert}
    password: ${RABBITMQ_DEFAULT_PASS:medalert_dev_pw}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

medalert:
  cors:
    allowed-origins: ${ALLOWED_ORIGIN:http://localhost:*,http://127.0.0.1:*}
  rabbitmq:
    exchange: medalert.eventos
    routing-key: cancelacion.registrada
    queue: cancelaciones.eventos
  mail:
    from: ${MAIL_FROM:notificaciones@medalertpro.test}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID}
    auth-token: ${TWILIO_AUTH_TOKEN}
    sms-from-number: ${TWILIO_SMS_FROM_NUMBER}
    whatsapp-from-number: ${TWILIO_WHATSAPP_FROM_NUMBER:whatsapp:+14155238886}
  escalacion:
    # En producción: 60 (minutos). Para pruebas de desarrollo, bájalo a algo
    # como 1 minuto vía variable de entorno ESCALACION_MINUTOS_ESPERA, si no
    # quieres esperar una hora para ver la escalación en acción.
    minutos-espera: ${ESCALACION_MINUTOS_ESPERA:60}
  recordatorios:
    # 09:00 hora del servidor (America/Santiago desde el fix de zona horaria).
    # Formato cron de Spring: segundo minuto hora día-mes mes día-semana.
    cron: ${RECORDATORIOS_CRON:0 0 9 * * *}
  admin:
    token: ${MEDALERT_ADMIN_TOKEN:medalert-admin-dev-token}
  reportes:
    # Estimación editorial usada solo para el KPI "horas admin. ahorradas" del
    # reporte mensual: minutos que le habría tomado al personal contactar
    # manualmente a cada paciente notificado. No es una medición real.
    minutos-por-notificacion-manual: ${REPORTE_MINUTOS_POR_NOTIFICACION:3}

logging:
  level:
    cl.medalertpro: DEBUG
